# The toolchain and every gate, declared once. CI runs `mise run check`.
#
#   mise install            the pinned tools (versions here, checksums in mise.lock)
#   mise run check          the whole gate, its checks in parallel
#   mise run check:<name>   one check (mise tasks lists them)
#   mise run golden         re-emit the public surfaces and diff them against tests/golden
#   mise run golden:update  rewrite tests/golden from the binary
#   mise run install        build the binary into ~/.local/bin (from the main checkout)
#   mise tasks              every task and what it does

min_version = "2026.10.15"

[settings]
# The platforms that install from this lock: macOS arm64 and the Linux x64 CI runners.
lockfile_platforms = ["macos-arm64", "linux-x64"]
locked = true

[settings.task]
# Tasks that run together print one after another, each whole and labeled.
output = "keep-order"

[env]
# mise owns the Go release; Go must not silently download another toolchain.
GOTOOLCHAIN = "local"

[tools]
# Matches go.mod's toolchain line.
go = "1.27.3"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
# find(by="text") and its tests shell out to rg.
ripgrep = "15.1.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[tasks.check]
description = "The whole gate, as CI runs it: every check:* task and golden, in parallel"
# A pattern picks up each check:* task as it is added; --continue-on-error lets
# every check finish, so one run names every failure.
run = "mise run --continue-on-error 'check:*' ::: golden"

[tasks."check:gofmt"]
description = "Every tracked or new Go file is gofmt-clean"
run = '''
list=$(mktemp)
trap 'rm -f "$list"' EXIT
git ls-files -z --cached --others --exclude-standard '*.go' > "$list"
out=$(xargs -0 gofmt -l < "$list")
if [ -n "$out" ]; then
  echo "gofmt: run gofmt -w on:"
  echo "$out"
  exit 1
fi
'''

[tasks."check:vet"]
description = "go vet"
run = "go vet ./..."

[tasks."check:modernize"]
description = "Go's built-in fixer finds no remaining automatic modernizations"
run = "go fix -diff ./..."

[tasks.fix]
description = "Apply Go's built-in modernizations and formatting"
run = ["go fix ./...", "go fmt ./..."]

[tasks."check:modules"]
description = "Go module files are tidy and downloaded modules match their checksums"
run = ["go mod tidy -diff", "go mod verify"]

[tasks."check:tasks"]
description = "mise validates task dependencies, usage specifications and task configuration"
run = "mise tasks validate"

[tasks."check:test"]
description = "The test suite under the race detector"
run = "go test -race ./..."

[tasks."check:govulncheck"]
description = "Known vulnerabilities reachable from the code"
run = "govulncheck ./..."

[tasks."check:lint"]
description = "golangci-lint with .golangci.yml"
run = "golangci-lint run ./..."

[tasks."check:shellcheck"]
description = "ShellCheck over every tracked shell script"
run = '''
list=$(mktemp)
trap 'rm -f "$list"' EXIT
git ls-files -z '*.sh' > "$list"
xargs -0 shellcheck -x < "$list"
'''

[tasks."check:actionlint"]
description = "actionlint over the GitHub workflows"
run = "actionlint"

[tasks."check:secrets"]
description = "No tracked .env or .dev.vars file other than an example"
run = '''
bad=$(git -c core.quotePath=false ls-files | grep -E '(^|/)\.(env|dev\.vars)(\.|$)' | grep -vE '\.(env\.example|env\.tpl|dev\.vars\.example)$' || true)
if [ -n "$bad" ]; then
  echo "tracked secret files (untrack them):"
  echo "$bad"
  exit 1
fi
'''

[tasks."check:build-output"]
description = "No tracked build output (dist, playwright-report, test-results)"
run = '''
bad=$(git -c core.quotePath=false ls-files | grep -E '(^|/)(dist|playwright-report|test-results)(/|$)' || true)
if [ -n "$bad" ]; then
  echo "tracked build output (untrack it):"
  echo "$bad"
  exit 1
fi
'''

[tasks."check:conflict-copies"]
description = "No tracked file named like a sync conflict copy (\"name 2.md\")"
run = '''
bad=$(git -c core.quotePath=false ls-files | grep -E ' [0-9]+(\.[^/]*)?$' || true)
if [ -n "$bad" ]; then
  echo "conflict copies (remove or rename them):"
  echo "$bad"
  exit 1
fi
'''

[tasks.golden]
description = "Re-emit the public surfaces and diff them against tests/golden"
run = "bash tests/golden/verify.sh"

[tasks."golden:update"]
description = "Rewrite every file in tests/golden (and README's tool table) from the binary"
depends = ["readme"]
env = { SVMC_UPDATE_GOLDEN = "1" }
run = "bash tests/golden/verify.sh"

[tasks."release:tag-check"]
description = "Refuse a release tag that is not vX.Y.Z or whose major go.mod's module path lacks"
# The release workflow runs this before it builds; scripts/release_tag_check_test.go
# holds the script to its cases.
usage = '''
arg "<tag>" help="The release tag, such as v3.1.0"
'''
run = 'module=$(go list -m) && sh scripts/release-tag-check.sh "${usage_tag?}" "$module"'

[tasks.evals]
description = "Score retrieval on the fixture vault; SVMC_EVAL_VAULT scores a real vault read-only"
# Arguments pass through to the eval: --json, --misses, --backends ours,grep,
# --cases <file>. No usage spec, so mise forwards them as given.
run = "go run ./internal/evals/cmd/evals"

[tasks.install]
description = "Build severino-vault-mcp into ~/.local/bin and print its --fingerprint"
# mise points GOBIN at the selected Go's own bin, so `go install` would land
# off PATH; the build names its target instead.
run = [
  # A linked worktree's git dir differs from the repository's common one.
  '''
if [ "$(git rev-parse --absolute-git-dir)" != "$(git rev-parse --path-format=absolute --git-common-dir)" ]; then
  echo "refused: install replaces the binary every session runs; run it from the main checkout" >&2
  exit 1
fi
''',
  # Built beside its place and renamed over it, so a session that starts
  # during the build runs the old binary, never a half-written one.
  'go build -trimpath -ldflags="-s -w" -o "$HOME/.local/bin/severino-vault-mcp.new" ./cmd/severino-vault-mcp && mv -f "$HOME/.local/bin/severino-vault-mcp.new" "$HOME/.local/bin/severino-vault-mcp"',
  # Codex runs a copy of an installed plugin, so the copy is refreshed to
  # carry this checkout's skill.
  'if command -v codex >/dev/null 2>&1 && codex plugin list 2>/dev/null | grep -q "^severino-vault-mcp@severino-vault-mcp .*installed"; then codex plugin add severino-vault-mcp@severino-vault-mcp >/dev/null; fi',
  '"$HOME/.local/bin/severino-vault-mcp" --fingerprint',
]

[tasks.readme]
description = "Regenerate README's tool table from the registered tools"
env = { SVMC_UPDATE_README = "1" }
run = "go test -count=1 -run '^TestReadmeToolsTable$' ./internal/mcpserver"

[tasks.fuzz]
description = "Run one fuzz target, found by name in the test files"
usage = '''
arg "<target>" help="The fuzz function, such as FuzzSplit"
flag "--time <duration>" help="How long to fuzz" default="20s"
'''
run = '''
target="${usage_target?}"
case "$target" in
  Fuzz*) ;;
  *) echo "fuzz: $target is not a Fuzz function" >&2; exit 2 ;;
esac
files=$(git grep -l -E "^func $target\(" -- '*_test.go' || true)
if [ -z "$files" ]; then
  echo "fuzz: no test file defines $target" >&2
  exit 2
fi
if [ "$(echo "$files" | wc -l)" -gt 1 ]; then
  echo "fuzz: $target is defined in more than one package:" >&2
  echo "$files" >&2
  exit 2
fi
dir=$(dirname "$files")
go test "./$dir" -run '^$' -fuzz "^$target\$" -fuzztime "${usage_time?}"
'''

[tasks.bench]
description = "Run the benchmarks whose names match a pattern (all of them by default)"
usage = '''
arg "[pattern]" help="A -bench pattern, such as IndexBuild" default="."
'''
run = "go test ./... -run '^$' -bench \"${usage_pattern?}\""
