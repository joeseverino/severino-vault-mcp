# Example severino-vault-mcp configuration.
#
# Copy this file to ~/.config/severino-vault-mcp/config.toml and adjust it for
# your local vault. Every setting can also be overridden with the matching
# SVMC_* environment variable shown in README.md.

[vault]
path = "~/Documents/vault"
indexed_dirs = ["01 Projects", "02 Infrastructure", "03 Runbooks"]
daily_notes_dir = "00 Inbox/Daily Note"

[aliases]
# Optional local phrase -> doc_id map. By default this is
# "<vault>/.svmc/aliases.toml" so aliases can live with a private vault
# without being committed to this repository.
path = "~/Documents/vault/.svmc/aliases.toml"

[cache]
seconds = 30

[metadata]
# Optional URL for a downstream asset/project system. Leave empty when unused.
url = ""

[restricted]
# op:// reference to a dedicated 1Password item in a vault no service account
# can read. include_restricted releases a body only when `op read` of it
# succeeds through the desktop app, which asks for Touch ID. Leave it unset
# and restricted bodies are always withheld.
# unlock_ref = "op://Private-Vault/Unlock-Item/password"
audit_log = "~/.local/state/severino-vault-mcp/audit.log"

# Vault providers: separate stdio MCP servers that each add one vault with its
# own tools and schema profile. None by default. Repeat the table per provider.
# [[providers]]
# command = "example"
# args = ["mcp-provider"]
# config = "~/.config/example/config.toml"
# env = { EXAMPLE_HOME = "~/example" }
