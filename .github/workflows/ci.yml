name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cordon's reusable gate: the Go commands in cordon.checks.json (gofmt, vet,
  # test, govulncheck, golden contracts) folded with cordon's repo invariants.
  # Required check: `cordon / gate`.
  cordon:
    uses: joeseverino/cordon/.github/workflows/cordon-gate.yml@f0fbb6e1919514c024608254ec6501f821992ea5 # v2.1.0
    with:
      cordon-ref: f0fbb6e1919514c024608254ec6501f821992ea5
