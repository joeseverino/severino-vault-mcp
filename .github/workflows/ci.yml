name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # cordon's reusable gate: ruff, pytest, version alignment, and the built-wheel
  # import smoke, folded with cordon's repo invariants. Required check: `cordon / gate`.
  cordon:
    uses: joeseverino/cordon/.github/workflows/cordon-gate.yml@v2
