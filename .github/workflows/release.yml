# The release surface of this repo, the sibling of ci.yml. Versioning, the
# CHANGELOG, the tag, and the GitHub Release are cut by cordon's reusable
# cordon-release.yml; this repo just calls it. release-type `go` versions from
# the tags alone; there is no version file. Status check: cordon / release.
#
# ONE-TIME per-repo setting (required): Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".
# Guide: https://github.com/joeseverino/cordon/blob/main/docs/RELEASE.md
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cordon:
    permissions:
      contents: write
      pull-requests: write
    uses: joeseverino/cordon/.github/workflows/cordon-release.yml@f0fbb6e1919514c024608254ec6501f821992ea5 # v2.1.0
    with:
      release-type: go

  # Binaries for the release the job above just cut. The build flags match the
  # documented `go install -trimpath`; --fingerprint hashes the embedded
  # sources, so it is the same for every platform built from this tag.
  build:
    needs: cordon
    if: needs.cordon.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cordon.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.cordon.outputs.tag_name }}
        run: |
          name="severino-vault-mcp_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -o "dist/$name/severino-vault-mcp" ./cmd/severino-vault-mcp
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [cordon, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cordon.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
