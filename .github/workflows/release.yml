# The release surface of this repo, the sibling of ci.yml. Pushing a vX.Y.Z
# tag is the release: this builds the binaries for that tag and creates its
# GitHub Release with generated notes and the archives attached.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # The build flags match the documented `go install -trimpath`; --fingerprint
  # hashes the embedded sources, so it is the same for every platform built
  # from this tag.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # `go install ...@vN.x.y` resolves only when the module path carries the
      # tag's major as a /vN suffix (none for v0 and v1).
      - name: The module path matches the tag's major
        run: |
          module="$(go list -m)"
          major="${GITHUB_REF_NAME%%.*}"
          case "$major" in
            v0 | v1) want="" ;;
            *) want="/$major" ;;
          esac
          case "$module" in
            */v[0-9]*) have="/${module##*/}" ;;
            *) have="" ;;
          esac
          if [ "$have" != "$want" ]; then
            echo "::error file=go.mod::tag $GITHUB_REF_NAME needs the module path to end in '$want'; go.mod says $module"
            exit 1
          fi

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="severino-vault-mcp_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -o "dist/$name/severino-vault-mcp" ./cmd/severino-vault-mcp
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/SHA256SUMS
