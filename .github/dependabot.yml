version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    # One PR per cycle: codeql-action init/analyze/upload-sarif must move
    # together, or init and analyze run mismatched versions and fail.
    groups:
      github-actions:
        patterns:
          - "*"
